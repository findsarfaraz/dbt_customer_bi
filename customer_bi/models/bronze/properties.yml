version: 2

models:
  - name: bronze_date
    description: "A date dimension table."
    columns:
      - name: date
        tests:
          - not_null
          - unique



  - name: bronze_store
    description: "A store dimension table."
    columns:
      - name: store_name
        data_tests:
          - accepted_values:
              values:
                - "MegaMart Manhattan"
                - "MegaMart Brooklyn"
                - "MegaMart Austin"
                - "MegaMart San Jose"
                - "MegaMart Toronto"
                

  