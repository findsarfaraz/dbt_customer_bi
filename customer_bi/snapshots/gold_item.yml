snapshots:
  - name: gold_item
    relation: ref('items_scd2')
    config:
      schema: gold
      database: dev
      unique_key: id
      strategy: timestamp
      updated_at: create_datetime    
      dbt_valid_to_current: "to_date('9999-12-31')" # Specifies that current records should have `dbt_valid_to` set to `'9999-12-31'` instead of `NULL`.dt